                                                                {donation.donationType || donation.DonationType}
                                                            </span>
                                                        </td>
                                                        <td style={{fontWeight: 800, color: 'var(--success)'}}>
                                                            LKR {amt ? Number(amt).toLocaleString() : '0.00'}
                                                        </td>
                                                        <td style={{maxWidth: '280px'}}>{donation.description || donation.Description}</td>
                                                        <td>{donation.date || donation.Date}</td>
                                                        <td style={{textAlign: 'right'}}>
                                                            <button 
                                                                className="btn-outline-glass" 
                                                                onClick={() => handleDisconnectDonation(dId)}
                                                                style={{color: 'var(--danger)', borderColor: 'rgba(225,29,72,0.3)', fontSize: '11px'}}>
                                                                ❌ Unlink
                                                            </button>
                                                        </td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            )}
                        </div>
                    )}

                    {/* ================= SECTOR 5: COMPLETE ALLOCATION MATRIX ================= */}
                    {activeSector === 'matrix' && (
                        <div>
                            <div className="content-card">
                                <h3 style={{marginTop: 0, marginBottom: '6px', fontSize: '20px', fontWeight: 900}}>
                                    🌐 Complete Humanitarian Allocation Matrix
                                </h3>
                                <p style={{margin: '0 0 20px 0', color: 'var(--text-muted)', fontSize: '13.5px'}}>
                                    Cross-sector telemetry across all crisis zones in Sri Lanka.
                                </p>

                                <div style={{display: 'flex', flexDirection: 'column', gap: '20px'}}>
                                    {crises.map(c => {
                                        const cId = getId(c);
                                        const cShelters = shelters.filter(s => getCrisisId(s) === cId);
                                        const cResources = resources.filter(r => getCrisisId(r) === cId);
                                        const cVolunteers = volunteers.filter(v => getCrisisId(v) === cId);
                                        const cDonations = donations.filter(d => getCrisisId(d) === cId);
                                        const cDonationSum = cDonations.reduce((sum, d) => sum + (parseFloat(d.amount ?? d.Amount ?? 0)), 0);

                                        return (
                                            <div key={cId} style={{background: '#ffffff', borderRadius: '16px', padding: '22px', border: '1px solid rgba(0,0,0,0.08)', boxShadow: '0 4px 15px rgba(0,0,0,0.03)'}}>
                                                <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '14px', flexWrap: 'wrap', gap: '10px'}}>
                                                    <div>
                                                        <span className={`badge ${(c.severity || c.Severity) === 'Critical' ? 'badge-red' : ((c.severity || c.Severity) === 'High' ? 'badge-amber' : 'badge-blue')}`} style={{marginRight: '8px'}}>
                                                            {c.severity || c.Severity}
                                                        </span>
                                                        <strong style={{fontSize: '17px', color: 'var(--text-main)'}}>{c.title || c.Title}</strong>
                                                        <span style={{fontSize: '13px', color: 'var(--text-muted)', marginLeft: '10px'}}>📍 {c.location || c.Location}</span>
                                                    </div>
                                                    <button 
                                                        className="btn-outline-glass" 
                                                        onClick={() => {
                                                            setSelectedCrisisId(cId);
                                                            setActiveSector('shelters');
                                                        }}
                                                        style={{color: 'var(--primary)', borderColor: 'var(--primary)', fontWeight: 800}}>
                                                        ⚙️ Manage Incident Connections &rarr;
                                                    </button>
                                                </div>

                                                <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '12px'}}>
                                                    <div style={{background: 'rgba(2, 132, 199, 0.05)', padding: '12px 16px', borderRadius: '12px'}}>
                                                        <div style={{fontSize: '11px', fontWeight: 800, color: 'var(--primary)', textTransform: 'uppercase'}}>🏕️ Shelters ({cShelters.length})</div>
                                                        <div style={{fontSize: '12.5px', marginTop: '4px', fontWeight: 600}}>
                                                            {cShelters.length > 0 ? cShelters.map(s => s.name || s.Name).join(', ') : <span style={{color: 'var(--text-muted)'}}>None assigned</span>}
                                                        </div>
                                                    </div>
                                                    <div style={{background: 'rgba(5, 150, 105, 0.05)', padding: '12px 16px', borderRadius: '12px'}}>
                                                        <div style={{fontSize: '11px', fontWeight: 800, color: 'var(--success)', textTransform: 'uppercase'}}>📦 Resources ({cResources.length})</div>
                                                        <div style={{fontSize: '12.5px', marginTop: '4px', fontWeight: 600}}>
                                                            {cResources.length > 0 ? cResources.map(r => `${r.name || r.Name} (${r.quantity || r.Quantity})`).join(', ') : <span style={{color: 'var(--text-muted)'}}>None allocated</span>}
                                                        </div>
                                                    </div>
                                                    <div style={{background: 'rgba(124, 58, 237, 0.05)', padding: '12px 16px', borderRadius: '12px'}}>
                                                        <div style={{fontSize: '11px', fontWeight: 800, color: 'var(--purple)', textTransform: 'uppercase'}}>🤝 Volunteers ({cVolunteers.length})</div>
                                                        <div style={{fontSize: '12.5px', marginTop: '4px', fontWeight: 600}}>
                                                            {cVolunteers.length > 0 ? cVolunteers.map(v => v.name || v.Name).join(', ') : <span style={{color: 'var(--text-muted)'}}>None deployed</span>}
                                                        </div>
                                                    </div>
                                                    <div style={{background: 'rgba(217, 119, 6, 0.05)', padding: '12px 16px', borderRadius: '12px'}}>
                                                        <div style={{fontSize: '11px', fontWeight: 800, color: 'var(--warning)', textTransform: 'uppercase'}}>🎁 Donations ({cDonations.length})</div>
                                                        <div style={{fontSize: '12.5px', marginTop: '4px', fontWeight: 600}}>
                                                            {cDonations.length > 0 ? `LKR ${cDonationSum.toLocaleString()}` : <span style={{color: 'var(--text-muted)'}}>None allocated</span>}
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: CREATE NEW CRISIS */}
                    {isCreateCrisisOpen && (
                        <div className="modal-overlay">
                            <div className="ultimate-glass modal-content">
                                <button className="modal-close" onClick={() => setIsCreateCrisisOpen(false)}>&times;</button>
                                <h2 style={{marginTop: 0, marginBottom: '20px', fontSize: '22px', fontWeight: '900'}}>
                                    Create New Crisis Event
                                </h2>
                                <form onSubmit={handleCreateCrisis}>
                                    <div className="input-group">
                                        <label>Crisis Event Title</label>
                                        <input type="text" className="glass-input" required value={newCrisisTitle} onChange={e => setNewCrisisTitle(e.target.value)} placeholder="e.g. Kalutara Riverine Flood Response" />
                                    </div>
                                    <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '15px'}}>
                                        <div className="input-group">
                                            <label>Disaster Type</label>
                                            <select className="glass-input" value={newCrisisType} onChange={e => setNewCrisisType(e.target.value)}>
                                                <option>Flood</option>
                                                <option>Landslide</option>
                                                <option>Cyclone</option>
                                                <option>Tsunami</option>
                                                <option>Drought</option>
                                            </select>
                                        </div>
                                        <div className="input-group">
                                            <label>Severity Level</label>
                                            <select className="glass-input" value={newCrisisSeverity} onChange={e => setNewCrisisSeverity(e.target.value)}>
                                                <option>Critical</option>
                                                <option>High</option>
                                                <option>Medium</option>
                                                <option>Low</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div className="input-group">
                                        <label>District Location</label>
                                        <select className="glass-input" value={newCrisisLocation} onChange={e => setNewCrisisLocation(e.target.value)}>
                                            {SRI_LANKA_DISTRICTS.map(d => <option key={d} value={d}>{d}</option>)}
                                        </select>
                                    </div>
                                    <button type="submit" className="btn-glass" style={{marginTop: '15px'}}>
                                        Create & Open Coordinator
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // =========================================================================
        // DYNAMIC DATA TABLE (WITH SMART CRISIS & SHELTER LINK DROPDOWNS)
        // =========================================================================
        function DynamicDataTable({ title, endpoint, cols, userRole, onCoordinateCrisis }) {
            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(true);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [formData, setFormData] = useState({});
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [editId, setEditId] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');

            // Reference lists for linking
            const [crisesList, setCrisesList] = useState([]);
            const [sheltersList, setSheltersList] = useState([]);

            const [reqDistrict, setReqDistrict] = useState('Kalutara');
            const [reqAddress, setReqAddress] = useState('');
            const [reqCategory, setReqCategory] = useState('Medical');
            const [reqUrgency, setReqUrgency] = useState('High');
            const [reqStatus, setReqStatus] = useState('Pending');
            const [reqDesc, setReqDesc] = useState('');

            const loadData = () => {
                setLoading(true);
                fetch(`${API_BASE}/${endpoint}`)
                    .then(res => res.json())
                    .then(json => { 
                        setData(Array.isArray(json) ? json : []); 
                        setLoading(false); 
                    })
                    .catch(() => { 
                        setData([]); 
                        setLoading(false); 
                    });
            };

            const loadReferences = async () => {
                try {
                    const [cRes, sRes] = await Promise.all([
                        fetch(`${API_BASE}/CrisisEvents`),
                        fetch(`${API_BASE}/Shelters`)
                    ]);
                    if (cRes.ok) setCrisesList(await cRes.json());
                    if (sRes.ok) setSheltersList(await sRes.json());
                } catch(e) {}
            };

            useEffect(() => { 
                loadData(); 
                loadReferences();
            }, [endpoint]);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'Escape' && isModalOpen) setIsModalOpen(false);
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [isModalOpen]);

            const handleAddClick = () => {
                setEditId(null);
                setReqDistrict('Kalutara');
                setReqAddress('');
                setReqCategory('Medical');
                setReqUrgency('High');
                setReqStatus('Pending');
                setReqDesc('');
                setFormData({});
                setIsModalOpen(true);
            };

            const handleModifyClick = (row) => {
                if (userRole !== 'Admin') {
                    alert("Unauthorized: Only Admins have modification privileges.");
                    return;
                }
                const rId = getId(row);
                setEditId(rId);

                if (endpoint === 'AssistanceRequest') {
                    const loc = row.location || row.Location || "";
                    const parts = loc.split(',');
                    if (parts.length > 1) {
                        setReqAddress(parts[0].trim());
                        setReqDistrict(parts[1].replace('District', '').trim());
                    } else {
                        setReqAddress(loc);
                        setReqDistrict('Kalutara');
                    }
                    setReqCategory(row.category || row.Category || 'Medical');
                    setReqUrgency(row.urgency || row.Urgency || 'High');
                    setReqStatus(row.status || row.Status || 'Pending');
                    setReqDesc(row.description || row.Description || '');
                }

                const populateData = {};
                cols.filter(c => c.toLowerCase() !== 'id').forEach(col => {
                    const foundKey = Object.keys(row).find(k => k.toLowerCase() === col.toLowerCase());
                    populateData[col] = foundKey ? row[foundKey] : '';
                });
                setFormData(populateData);
                setIsModalOpen(true);
            };

            const handleInputChange = (colName, value) => {
                setFormData(prev => Object.assign({}, prev, { [colName]: value }));
            };

            const handleDelete = async (id) => {
                if (userRole !== 'Admin') {
                    alert("Unauthorized: Only Admins have deletion privileges.");
                    return;
                }
                if (!confirm(`Are you sure you want to delete record ID: ${id}?`)) return;

                try {
                    const res = await fetch(`${API_BASE}/${endpoint}/${id}`, { method: 'DELETE' });
                    if (res.ok) {
                        loadData();
                    } else {
                        alert("Deletion failed on server.");
                    }
                } catch (error) {
                    alert("Network error. Backend not reachable.");
                }
            };

            const handleRunAI = async (id) => {
                try {
                    const res = await fetch(`${API_BASE}/AIRecommendation/generate/${id}`, { method: 'POST' });
                    const result = await res.json();
                    
                    if (res.ok) {
                        const classification = result.classification || result.Classification || "Emergency Aid";
                        const priority = result.priority || result.Priority || "High Priority";
                        const duplicateCheck = result.duplicateCheck || result.DuplicateCheck || "✅ Verified Unique";
                        const resourceMatch = result.resourceMatch || result.ResourceMatch || "Nearest Emergency Relief Stock Allocated";
                        const volunteerMatch = result.volunteerMatch || result.VolunteerMatch || "Rapid Deployment Volunteer Alerted";

                        alert(`🤖 AI Triage & Verification Output:\n\n` +
                              `• Classification: ${classification}\n` +
                              `• Priority Prediction: ${priority}\n` +
                              `• Duplicate Verification: ${duplicateCheck}\n` +
                              `• Recommended Resource: ${resourceMatch}\n` +
                              `• Volunteer Deployment: ${volunteerMatch}`);
                    } else {
                        alert("AI analysis returned an error.");
                    }
                } catch (error) {
                    alert("Network error. AI Recommendation Engine unreachable.");
                }
            };

            const handleFormSubmit = async (e) => {
                e.preventDefault();
                setIsSubmitting(true);

                const payload = { Id: editId ? editId : 0 };

                if (endpoint === 'AssistanceRequest') {
                    payload.Category = reqCategory;
                    payload.Location = `${reqAddress || 'Town Center'}, ${reqDistrict} District`;
                    payload.Urgency = reqUrgency;
                    payload.Status = reqStatus;
                    payload.Description = reqDesc || "Emergency reported";
                } else {
                    cols.filter(c => c.toLowerCase() !== 'id').forEach(col => {
                        let val = formData[col];
                        if (col === 'CrisisEventId' || col === 'ShelterId') {
                            val = (val !== undefined && val !== "" && val !== null) ? parseInt(val) : null;
                        } else if (col === 'Capacity' || col === 'CurrentOccupancy' || col === 'Quantity') {
                            val = val ? parseInt(val) : 0;
                        } else if (col === 'Amount') {
                            val = val ? parseFloat(val) : 0;
                        }
                        payload[col] = val !== undefined ? val : "";
                    });
                }

                try {
                    const url = editId ? `${API_BASE}/${endpoint}/${editId}` : `${API_BASE}/${endpoint}`;
                    const method = editId ? 'PUT' : 'POST';

                    const res = await fetch(url, {
                        method: method,
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    if (res.ok) {
                        setIsModalOpen(false); 
                        loadData(); 
                    } else {
                        const errText = await res.text();
                        alert(`Save failed: ${errText || 'Verify server payload.'}`);
                    }
                } catch(error) {
                    alert("Network error. Backend not reachable.");
                }
                setIsSubmitting(false);
            };

            const filteredData = data.filter(row => {
                if (!searchQuery.trim()) return true;
                return Object.values(row).some(v => 
                    String(v).toLowerCase().indexOf(searchQuery.toLowerCase().trim()) !== -1
                );
            });

            const renderBadge = (col, val) => {
                if (col === 'CrisisEventId') {
                    if (!val) return <span className="badge badge-gray">Unassigned</span>;
                    const c = crisesList.find(x => getId(x) === parseInt(val));
                    return (
                        <span className="badge badge-purple" title={c ? (c.title || c.Title) : `Event #${val}`}>
                            ⚡ {c ? (c.title || c.Title) : `Event #${val}`}
                        </span>
                    );
                }
                if (col === 'ShelterId') {
                    if (!val) return <span className="badge badge-gray">None / General</span>;
                    const s = sheltersList.find(x => getId(x) === parseInt(val));
                    return (
                        <span className="badge badge-blue" title={s ? (s.name || s.Name) : `Shelter #${val}`}>
                            🏕️ {s ? (s.name || s.Name) : `Shelter #${val}`}
                        </span>
                    );
                }

                const s = String(val).toLowerCase();
                if (s === 'high' || s === 'critical' || s === 'emergency') return <span className="badge badge-red">{val}</span>;
                if (s === 'pending' || s === 'in progress' || s === 'moderate') return <span className="badge badge-amber">{val}</span>;
                if (s === 'resolved' || s === 'deployed' || s === 'available' || s === 'low') return <span className="badge badge-green">{val}</span>;
                return <span style={{fontWeight: 600}}>{val !== null && val !== undefined ? String(val) : '-'}</span>;
            };

            return (
                <div className="content-card">
                    <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '22px', flexWrap: 'wrap', gap: '15px'}}>
                        <div>
                            <h2 style={{margin: '0 0 4px 0', fontSize: '22px', fontWeight: '900'}}>{title}</h2>
                            <span style={{fontSize: '12.5px', color: 'var(--text-muted)', fontWeight: 600}}>
                                Showing {filteredData.length} of {data.length} records
                            </span>
                        </div>
                        <div style={{display: 'flex', gap: '10px', alignItems: 'center'}}>
                            <input 
                                type="text" 
                                placeholder="🔍 Filter records..." 
                                className="glass-input" 
                                value={searchQuery}
                                onChange={e => setSearchQuery(e.target.value)}
                                style={{padding: '8px 14px', width: '220px', fontSize: '12px'}}
                            />
                            {userRole === 'Admin' && endpoint !== 'AssistanceRequest' && (
                                <button className="btn-glass" onClick={handleAddClick} style={{width: 'auto', padding: '8px 18px', fontSize: '12.5px'}}>
                                    + Add New
                                </button>
                            )}
                        </div>
                    </div>

                    {loading ? (
                        <p style={{color: 'var(--text-muted)', fontWeight: 700}}>Fetching sector data from server...</p>
                    ) : (
                        <div className="table-container">
                            <table>
                                <thead>
                                    <tr>
                                        {cols.map(c => <th key={c}>{c.replace(/([A-Z])/g, ' $1').trim()}</th>)}
                                        <th style={{textAlign: 'right'}}>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {filteredData.length === 0 ? (
                                        <tr>
                                            <td colSpan={cols.length + 1} style={{textAlign: 'center', color: 'var(--text-muted)', padding: '40px', fontWeight: '700'}}>
                                                No records found matching criteria.
                                            </td>
                                        </tr>
                                    ) : (
                                        filteredData.map((row, i) => {
                                            const rowId = getId(row);
                                            return (
                                                <tr key={rowId || i}>
                                                    {cols.map(c => {
                                                        const exactKey = Object.keys(row).find(k => k.toLowerCase() === c.toLowerCase());
                                                        const val = exactKey ? row[exactKey] : (row[c] !== undefined ? row[c] : '-');
                                                        return <td key={c}>{renderBadge(c, val)}</td>;
                                                    })}
                                                    <td style={{textAlign: 'right'}}>
                                                        <div className="actions-cell" style={{justifyContent: 'flex-end'}}>
                                                            {endpoint === 'CrisisEvents' && (
                                                                <button 
                                                                    className="btn-outline-glass" 
                                                                    onClick={() => onCoordinateCrisis(rowId)}
                                                                    style={{padding: '5px 10px', fontSize: '11px', color: 'var(--primary)', borderColor: 'rgba(2,132,199,0.3)', fontWeight: 800}}>
                                                                    🔗 Connect & Allocate
                                                                </button>
                                                            )}
                                                            {endpoint === 'AssistanceRequest' && (
                                                                <button 
                                                                    className="btn-outline-glass" 
                                                                    onClick={() => handleRunAI(rowId)}
                                                                    style={{padding: '5px 10px', fontSize: '11px', color: 'var(--primary)', borderColor: 'rgba(2,132,199,0.3)'}}>
                                                                    🤖 AI Triage
                                                                </button>
                                                            )}
                                                            {userRole === 'Admin' && (
                                                                <React.Fragment>
                                                                    <button 
                                                                        className="btn-outline-glass" 
                                                                        onClick={() => handleModifyClick(row)}
                                                                        style={{padding: '5px 10px', fontSize: '11px', color: 'var(--warning)', borderColor: 'rgba(217,119,6,0.3)'}}>
                                                                        Modify
                                                                    </button>
                                                                    <button 
                                                                        className="btn-outline-glass" 
                                                                        onClick={() => handleDelete(rowId)}
                                                                        style={{padding: '5px 10px', fontSize: '11px', color: 'var(--danger)', borderColor: 'rgba(225,29,72,0.3)'}}>
                                                                        Delete
                                                                    </button>
                                                                </React.Fragment>
                                                            )}
                                                        </div>
                                                    </td>
                                                </tr>
                                            );
                                        })
                                    )}
                                </tbody>
                            </table>
                        </div>
                    )}

                    {isModalOpen && (
                        <div className="modal-overlay">
                            <div className="ultimate-glass modal-content">
                                <button className="modal-close" onClick={() => setIsModalOpen(false)}>&times;</button>
                                <h2 style={{marginTop: 0, marginBottom: '20px', fontSize: '22px', fontWeight: '900', color: 'var(--text-main)'}}>
                                    {editId ? `Modify Record (ID: ${editId})` : `Add Record (${endpoint})`}
                                </h2>
                                
                                <form onSubmit={handleFormSubmit}>
                                    {endpoint === 'AssistanceRequest' ? (
                                        <div>
                                            <div className="input-group">
                                                <label>District</label>
                                                <select className="glass-input" value={reqDistrict} onChange={e => setReqDistrict(e.target.value)}>
                                                    {SRI_LANKA_DISTRICTS.map(dist => (
                                                        <option key={dist} value={dist}>{dist}</option>
                                                    ))}
                                                </select>
                                            </div>
                                            <div className="input-group">
                                                <label>Coordinates / Address</label>
                                                <input type="text" className="glass-input" required value={reqAddress} onChange={e => setReqAddress(e.target.value)} placeholder="e.g. Main Street, Town Center" />
                                            </div>
                                            <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '15px'}}>
                                                <div className="input-group">
                                                    <label>Category</label>
                                                    <select className="glass-input" value={reqCategory} onChange={e => setReqCategory(e.target.value)}>
                                                        <option>Medical</option>
                                                        <option>Resource Deficit</option>
                                                        <option>Evacuation</option>
                                                        <option>Food / Water</option>
                                                    </select>
                                                </div>
                                                <div className="input-group">
                                                    <label>Urgency</label>
                                                    <select className="glass-input" value={reqUrgency} onChange={e => setReqUrgency(e.target.value)}>
                                                        <option>Critical</option>
                                                        <option>High</option>
                                                        <option>Moderate</option>
                                                        <option>Low</option>
                                                    </select>
                                                </div>
                                            </div>
                                            <div className="input-group">
                                                <label>Status</label>
                                                <select className="glass-input" value={reqStatus} onChange={e => setReqStatus(e.target.value)}>
                                                    <option>Pending</option>
                                                    <option>In Progress</option>
                                                    <option>Resolved</option>
                                                </select>
                                            </div>
                                            <div className="input-group">
                                                <label>Incident Details</label>
                                                <textarea className="glass-input" rows="4" required value={reqDesc} onChange={e => setReqDesc(e.target.value)} placeholder="Detailed description of humanitarian emergency..."></textarea>
                                            </div>
                                        </div>
                                    ) : (
                                        <div>
                                            {cols.filter(c => c.toLowerCase() !== 'id').map(col => {
                                                if (col === 'CrisisEventId') {
                                                    return (
                                                        <div className="input-group" key={col}>
                                                            <label>⚡ Connected Crisis Event</label>
                                                            <select 
                                                                className="glass-input" 
                                                                value={formData[col] || ''} 
                                                                onChange={e => handleInputChange(col, e.target.value)}>
                                                                <option value="">-- None (Unassigned Pool) --</option>
                                                                {crisesList.map(c => (
                                                                    <option key={getId(c)} value={getId(c)}>
                                                                        {c.title || c.Title} ({c.location || c.Location})
                                                                    </option>
                                                                ))}
                                                            </select>
                                                        </div>
                                                    );
                                                }
                                                if (col === 'ShelterId') {
                                                    return (
                                                        <div className="input-group" key={col}>
                                                            <label>🏕️ Target Shelter (Optional)</label>
                                                            <select 
                                                                className="glass-input" 
                                                                value={formData[col] || ''} 
                                                                onChange={e => handleInputChange(col, e.target.value)}>
                                                                <option value="">-- None (General Incident Allocation) --</option>
                                                                {sheltersList.map(s => (
                                                                    <option key={getId(s)} value={getId(s)}>
                                                                        {s.name || s.Name} ({s.location || s.Location})
                                                                    </option>
                                                                ))}
                                                            </select>
                                                        </div>
                                                    );
                                                }
                                                return (
                                                    <div className="input-group" key={col}>
                                                        <label>{col.replace(/([A-Z])/g, ' $1').trim()}</label>
                                                        <input 
                                                            type={col === 'Capacity' || col === 'CurrentOccupancy' || col === 'Quantity' || col === 'Amount' ? 'number' : 'text'} 
                                                            className="glass-input" 
                                                            required={col !== 'CrisisEventId' && col !== 'ShelterId'} 
                                                            value={formData[col] !== undefined ? formData[col] : ''} 
                                                            onChange={e => handleInputChange(col, e.target.value)} 
                                                            placeholder={`Enter ${col}`}
                                                        />
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}
                                    <button type="submit" className="btn-glass" disabled={isSubmitting} style={{marginTop: '15px'}}>
                                        {isSubmitting ? 'Communicating with Mainframe...' : (editId ? 'Save Modifications' : 'Commit Record')}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function SubmitRequest({ onDone }) {
            const [formData, setFormData] = useState({ district: 'Kalutara', address: '', category: 'Medical', urgency: 'High', desc: '' });
            const [status, setStatus] = useState('');
            const [isTransmitting, setIsTransmitting] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setIsTransmitting(true);
                setStatus('Transmitting emergency dispatch...');
                
                const payload = {
                    Id: 0,
                    Category: formData.category,
                    Location: `${formData.address || 'Town Center'}, ${formData.district} District`,
                    Urgency: formData.urgency,
                    Status: "Pending",
                    Description: formData.desc
                };

                try {
                    const res = await fetch(`${API_BASE}/AssistanceRequest`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    if(res.ok) {
                        setStatus('✅ Emergency signal successfully routed to response coordinators.');
                        setFormData({ district: 'Kalutara', address: '', category: 'Medical', urgency: 'High', desc: '' });
                        if (onDone) setTimeout(onDone, 2000);
                    } else {
                        const err = await res.text();
                        setStatus(`❌ Transmission failed: ${err}`);
                    }
                } catch(error) { 
                    setStatus('❌ Network error. Mainframe unreachable.'); 
                }
                setIsTransmitting(false);
            };

            return (
                <div className="content-card" style={{maxWidth: '750px', margin: '0 auto'}}>
                    <h2 style={{marginTop: 0, marginBottom: '25px', fontSize: '24px', fontWeight: '900'}}>Dispatch Emergency Signal</h2>
                    <form onSubmit={handleSubmit}>
                        <div style={{display: 'grid', gridTemplateColumns: '1fr 2fr', gap: '15px'}}>
                            <div className="input-group">
                                <label>District</label>
                                <select className="glass-input" value={formData.district} onChange={e => setFormData(Object.assign({}, formData, { district: e.target.value }))}>
                                    {SRI_LANKA_DISTRICTS.map(dist => (
                                        <option key={dist} value={dist}>{dist}</option>
                                    ))}
                                </select>
                            </div>
                            <div className="input-group">
                                <label>Coordinates / Exact Location</label>
                                <input type="text" className="glass-input" required value={formData.address} onChange={e => setFormData(Object.assign({}, formData, { address: e.target.value }))} placeholder="e.g., Hospital Junction, Galle Road" />
                            </div>
                        </div>

                        <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '15px'}}>
                            <div className="input-group">
                                <label>Incident Classification</label>
                                <select className="glass-input" value={formData.category} onChange={e => setFormData(Object.assign({}, formData, { category: e.target.value }))}>
                                    <option>Medical</option>
                                    <option>Resource Deficit</option>
                                    <option>Evacuation</option>
                                    <option>Food / Water</option>
                                </select>
                            </div>
                            <div className="input-group">
                                <label>Urgency Level</label>
                                <select className="glass-input" value={formData.urgency} onChange={e => setFormData(Object.assign({}, formData, { urgency: e.target.value }))}>
                                    <option>High</option>
                                    <option>Critical</option>
                                    <option>Moderate</option>
                                    <option>Low</option>
                                </select>
                            </div>
                        </div>

                        <div className="input-group">
                            <label>Situation Details</label>
                            <textarea className="glass-input" rows="5" required value={formData.desc} onChange={e => setFormData(Object.assign({}, formData, { desc: e.target.value }))} placeholder="Describe required resources, number of affected people, and current ground situation..."></textarea>
                        </div>
                        <button type="submit" className="btn-glass" disabled={isTransmitting}>
                            {isTransmitting ? 'Transmitting Signal...' : 'Transmit Emergency Request'}
                        </button>
                    </form>
                    {status && (
                        <div style={{marginTop: '20px', padding: '14px 18px', background: '#ffffff', borderRadius: '12px', fontWeight: '700', fontSize: '14px', borderLeft: '4px solid var(--primary)', boxShadow: '0 2px 8px rgba(0,0,0,0.05)'}}>
                            {status}
                        </div>
                    )}
                </div>
            );
        }

        function CitizenDonationForm({ user, onDone }) {
            const [donorName, setDonorName] = useState(user ? user.username : '');
            const [donationType, setDonationType] = useState('Monetary');
            const [amount, setAmount] = useState('');
            const [desc, setDesc] = useState('');
            const [selectedCrisisId, setSelectedCrisisId] = useState('');
            const [crisesList, setCrisesList] = useState([]);
            const [status, setStatus] = useState('');
            const [isSubmitting, setIsSubmitting] = useState(false);

            useEffect(() => {
                fetch(`${API_BASE}/CrisisEvents`)
                    .then(res => res.json())
                    .then(data => setCrisesList(Array.isArray(data) ? data : []))
                    .catch(() => {});
            }, []);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setIsSubmitting(true);
                setStatus('Processing humanitarian donation...');

                const payload = {
                    Id: 0,
                    DonorName: donorName || "Anonymous Citizen",
                    DonationType: donationType,
                    Amount: parseFloat(amount || 0),
                    Description: desc || `${donationType} relief contribution from citizen`,
                    Date: new Date().toISOString().split('T')[0],
                    CrisisEventId: selectedCrisisId ? parseInt(selectedCrisisId) : null
                };

                try {
                    const res = await fetch(`${API_BASE}/Donations`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (res.ok) {
                        setStatus(`✅ Thank you, ${donorName || 'Donor'}! Your donation of LKR ${parseFloat(amount || 0).toLocaleString()} has been successfully recorded.`);
                        setAmount('');
                        setDesc('');
                        if (onDone) setTimeout(onDone, 2500);
                    } else {
                        const err = await res.text();
                        setStatus(`❌ Donation submission failed: ${err}`);
                    }
                } catch (error) {
                    setStatus('❌ Network error. Backend unreachable.');
                }
                setIsSubmitting(false);
            };

            return (
                <div className="content-card" style={{maxWidth: '750px', margin: '0 auto'}}>
                    <div style={{display: 'flex', alignItems: 'center', gap: '14px', marginBottom: '22px'}}>
                        <div style={{fontSize: '32px', background: 'rgba(5, 150, 105, 0.12)', width: '56px', height: '56px', borderRadius: '16px', display: 'flex', alignItems: 'center', justifyContent: 'center'}}>
                            🎁
                        </div>
                        <div>
                            <h2 style={{margin: '0 0 4px 0', fontSize: '24px', fontWeight: '900'}}>Make a Humanitarian Donation</h2>
                            <p style={{margin: 0, color: 'var(--text-muted)', fontSize: '13.5px'}}>
                                Empower disaster relief efforts. Your contributions deliver food, clean water, and shelter supplies directly to impacted communities across Sri Lanka.
                            </p>
                        </div>
                    </div>

                    <form onSubmit={handleSubmit}>
                        <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '15px'}}>
                            <div className="input-group">
                                <label>Donor / Organization Name</label>
                                <input 
                                    type="text" 
                                    className="glass-input" 
                                    required 
                                    value={donorName} 
                                    onChange={e => setDonorName(e.target.value)} 
                                    placeholder="Your Name or Organization" 
                                />
                            </div>
                            <div className="input-group">
                                <label>Donation Type</label>
                                <select className="glass-input" value={donationType} onChange={e => setDonationType(e.target.value)}>
                                    <option value="Monetary">Monetary (Financial Aid)</option>
                                    <option value="Material">Material (Food, Water, Supplies)</option>
                                </select>
                            </div>
                        </div>

                        <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '15px'}}>
                            <div className="input-group">
                                <label>{donationType === 'Monetary' ? 'Contribution Amount (LKR)' : 'Estimated Material Value (LKR)'}</label>
                                <input 
                                    type="number" 
                                    className="glass-input" 
                                    required 
                                    min="1"
                                    step="any"
                                    value={amount} 
                                    onChange={e => setAmount(e.target.value)} 
                                    placeholder="e.g. 5000, 25000" 
                                />
                            </div>
                            <div className="input-group">
                                <label>Target Crisis Zone (Optional)</label>
                                <select className="glass-input" value={selectedCrisisId} onChange={e => setSelectedCrisisId(e.target.value)}>
                                    <option value="">-- General Emergency Relief Fund (All Sectors) --</option>
                                    {crisesList.map(c => (
                                        <option key={getId(c)} value={getId(c)}>
                                            ⚡ {c.title || c.Title} ({c.location || c.Location})
                                        </option>
                                    ))}
                                </select>
                            </div>
                        </div>

                        <div className="input-group">
                            <label>Donation Description / Itemized Details</label>
                            <textarea 
                                className="glass-input" 
                                rows="4" 
                                required 
                                value={desc} 
                                onChange={e => setDesc(e.target.value)} 
                                placeholder={donationType === 'Monetary' ? "Specify any dedicated purpose (e.g. Flood relief fund, dry rations support for children, medicine subsidy)..." : "Describe donated relief items (e.g. 100 bottled water cases, 50 hygiene packages, baby formula)..."}
                            ></textarea>
                        </div>

                        <button type="submit" className="btn-glass" disabled={isSubmitting} style={{background: 'linear-gradient(135deg, var(--success), #047857)', boxShadow: '0 4px 15px rgba(5,150,105,0.3)'}}>
                            {isSubmitting ? 'Recording Donation...' : '❤️ Submit Humanitarian Donation'}
                        </button>
                    </form>

                    {status && (
                        <div style={{marginTop: '20px', padding: '14px 18px', background: '#ffffff', borderRadius: '12px', fontWeight: '700', fontSize: '14px', borderLeft: '4px solid var(--success)', boxShadow: '0 2px 8px rgba(0,0,0,0.05)'}}>
                            {status}
                        </div>
                    )}
                </div>
            );
        }

        function CitizenVolunteerForm({ user, onDone }) {
            const [name, setName] = useState(user ? user.username : '');
            const [contactNumber, setContactNumber] = useState('');
            const [selectedDistrict, setSelectedDistrict] = useState('Kalutara');
            const [selectedSkill, setSelectedSkill] = useState('First Aid & Emergency Medical Support');
            const [customSkills, setCustomSkills] = useState('');
            const [status, setStatus] = useState('');
            const [isSubmitting, setIsSubmitting] = useState(false);

            const volunteerSkillsList = [
                "First Aid & Emergency Medical Support",
                "Swift Water, Boat & Flood Rescue",
                "Food Preparation & Dry Ration Distribution",
                "Camp, Shelter & Crowd Logistics Management",
                "Psychological Support & Child Care",
                "Telecommunications, Ham Radio & IT Systems",
                "Transport & 4WD Heavy Vehicle Driving",
                "General Relief Field Volunteer"
            ];

            const handleSubmit = async (e) => {
                e.preventDefault();
                setIsSubmitting(true);
                setStatus('Enrolling volunteer credentials...');

                const combinedSkills = `${selectedSkill}${customSkills ? ` (${customSkills})` : ''} [Sector: ${selectedDistrict}]`;

                const payload = {
                    Id: 0,
                    Name: name || "Volunteer Citizen",
                    Skills: combinedSkills,
                    ContactNumber: contactNumber,
                    Status: "Available",
                    CrisisEventId: null,
                    ShelterId: null
                };

                try {
                    const res = await fetch(`${API_BASE}/Volunteers`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (res.ok) {
                        setStatus(`✅ Thank you, ${name}! You are registered in the National Volunteer Roster. Dispatch coordinators will alert you when deployment teams mobilize in ${selectedDistrict}.`);
                        setContactNumber('');
                        setCustomSkills('');
                        if (onDone) setTimeout(onDone, 2500);
                    } else {
                        const err = await res.text();
                        setStatus(`❌ Volunteer registration failed: ${err}`);
                    }
                } catch (error) {
                    setStatus('❌ Network error. Backend unreachable.');
                }
                setIsSubmitting(false);
            };

            return (
                <div className="content-card" style={{maxWidth: '750px', margin: '0 auto'}}>
                    <div style={{display: 'flex', alignItems: 'center', gap: '14px', marginBottom: '22px'}}>
                        <div style={{fontSize: '32px', background: 'rgba(2, 132, 199, 0.12)', width: '56px', height: '56px', borderRadius: '16px', display: 'flex', alignItems: 'center', justifyContent: 'center'}}>
                            🤝
                        </div>
                        <div>
                            <h2 style={{margin: '0 0 4px 0', fontSize: '24px', fontWeight: '900'}}>Register as a Relief Volunteer</h2>
                            <p style={{margin: 0, color: 'var(--text-muted)', fontSize: '13.5px'}}>
                                Stand with fellow citizens during disasters. Sign up as a verified rapid-response volunteer for field triage, shelter support, and community assistance.
                            </p>
                        </div>
                    </div>

                    <form onSubmit={handleSubmit}>
                        <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '15px'}}>
                            <div className="input-group">
                                <label>Full Name</label>
                                <input 
                                    type="text" 
                                    className="glass-input" 
                                    required 
                                    value={name} 
                                    onChange={e => setName(e.target.value)} 
                                    placeholder="Your Full Name" 
                                />
                            </div>
                            <div className="input-group">
                                <label>Contact Hotline / Phone Number</label>
                                <input 
                                    type="tel" 
                                    className="glass-input" 
                                    required 
                                    value={contactNumber} 
                                    onChange={e => setContactNumber(e.target.value)} 
                                    placeholder="e.g. +94 77 123 4567" 
                                />
                            </div>
                        </div>

                        <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '15px'}}>
                            <div className="input-group">
                                <label>Primary Specialization / Skill</label>
                                <select className="glass-input" value={selectedSkill} onChange={e => setSelectedSkill(e.target.value)}>
                                    {volunteerSkillsList.map(skill => (
                                        <option key={skill} value={skill}>{skill}</option>
                                    ))}
                                </select>
                            </div>
                            <div className="input-group">
                                <label>Primary Available District</label>
                                <select className="glass-input" value={selectedDistrict} onChange={e => setSelectedDistrict(e.target.value)}>
                                    {SRI_LANKA_DISTRICTS.map(dist => (
                                        <option key={dist} value={dist}>{dist}</option>
                                    ))}
                                </select>
                            </div>
                        </div>

                        <div className="input-group">
                            <label>Additional Experience / Availability Notes</label>
                            <textarea 
                                className="glass-input" 
                                rows="4" 
                                value={customSkills} 
                                onChange={e => setCustomSkills(e.target.value)} 
                                placeholder="Describe any relevant experience (e.g. CPR certified, own 4WD truck, available weekends or nights, language proficiencies)..."
                            ></textarea>
                        </div>

                        <button type="submit" className="btn-glass" disabled={isSubmitting}>
                            {isSubmitting ? 'Enrolling in Volunteer Network...' : '🤝 Complete Volunteer Registration'}
                        </button>
                    </form>

                    {status && (
                        <div style={{marginTop: '20px', padding: '14px 18px', background: '#ffffff', borderRadius: '12px', fontWeight: '700', fontSize: '14px', borderLeft: '4px solid var(--primary)', boxShadow: '0 2px 8px rgba(0,0,0,0.05)'}}>
                            {status}
                        </div>
                    )}
                </div>
            );
        }

        function NotificationsPanel() {
            return (
                <div className="content-card" style={{maxWidth: '850px', margin: '0 auto'}}>
                    <h2 style={{marginTop: 0, marginBottom: '25px', fontSize: '24px', fontWeight: '900'}}>Official Emergency Broadcasts</h2>
                    
                    <div className="notification-item" style={{borderLeftColor: 'var(--danger)'}}>
                        <div className="notification-title">
                            <span>🚨 Severe Weather & Flood Risk Alert</span>
                            <span style={{fontSize: '11px', color: 'var(--text-muted)'}}>10 mins ago</span>
                        </div>
                        <div className="notification-desc">
                            Meteorological sensors report heavy rainfall exceeding 150mm across Kalutara, Galle, and Ratnapura districts. Disaster response teams and river basin evacuation protocols are primed.
                        </div>
                    </div>

                    <div className="notification-item" style={{borderLeftColor: 'var(--warning)'}}>
                        <div className="notification-title">
                            <span>⚠️ Medical Logistics Reallocation</span>
                            <span style={{fontSize: '11px', color: 'var(--text-muted)'}}>1 hour ago</span>
                        </div>
                        <div className="notification-desc">
                            Emergency medical supplies and water purification units have been redirected to the Southern relief corridor.
                        </div>
                    </div>

                    <div className="notification-item" style={{borderLeftColor: 'var(--success)'}}>
                        <div className="notification-title">
                            <span>✅ Volunteer Rapid Deployment Active</span>
                            <span style={{fontSize: '11px', color: 'var(--text-muted)'}}>3 hours ago</span>
                        </div>
                        <div className="notification-desc">
                            Over 40 registered volunteers deployed to central community shelters in Colombo and Gampaha.
                        </div>
                    </div>
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
